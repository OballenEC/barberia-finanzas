{% extends "base.html" %}
{% block title %}Nuevo ajuste · Barbería{% endblock %}
{% block content %}
<h1>Registrar ajuste de inventario</h1>
<p class="muted">Usa valores negativos para reducir stock (merma, robo), positivos para aumentar (corrección).</p>
<form method="post">
    <label>Fecha</label>
    <input type="date" name="fecha" value="{{ hoy }}" required>

    <label>Producto</label>
    <select name="producto_id" required>
        {% for p in productos %}<option value="{{ p.id }}">{{ p.nombre }} (stock {{ p.stock_actual }})</option>{% endfor
        %}
    </select>

    <label>Cantidad delta (ej. -1, +3)</label>
    <input type="number" name="cantidad_delta" required>

    <label>Motivo</label>
    <input type="text" name="motivo" required>

    <p><button class="btn" type="submit">Guardar</button>
        <a href="{{ url_for('inventario.listado') }}">Cancelar</a>
    </p>
</form>
{% endblock %}
