{% extends "base.html" %}
{% block title %}Nueva compra · Barbería{% endblock %}
{% block content %}
<h1>Registrar compra</h1>
<form method="post">
    <label>Fecha</label>
    <input type="date" name="fecha" value="{{ hoy }}" required>

    <label>Producto</label>
    <select name="producto_id" required>
        {% for p in productos %}<option value="{{ p.id }}">{{ p.nombre }}</option>{% endfor %}
    </select>

    <label>Cantidad</label>
    <input type="number" name="cantidad" min="1" required>

    <label>Costo unitario</label>
    <input type="text" name="costo_unitario" inputmode="decimal" required>

    <p><button class="btn" type="submit">Guardar</button>
        <a href="{{ url_for('inventario.listado') }}">Cancelar</a>
    </p>
</form>
{% endblock %}
