{% extends "base.html" %}
{% block title %}Nuevo gasto · Barbería{% endblock %}
{% block content %}

  <div class="page-header">
    <div>
      <h1><i class="bi bi-plus-circle"></i> Registrar gasto operativo</h1>
      <p class="muted mb-0">Renta, servicios, insumos que no se revenden, etc.</p>
    </div>
    <a class="btn btn-secondary" href="{{ url_for('gastos.listado') }}">
      <i class="bi bi-arrow-left"></i> Volver
    </a>
  </div>

  <div class="card">
    <div class="card-body p-4">
      <form method="post">

        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label class="form-label"><i class="bi bi-calendar-event"></i> Fecha</label>
            <input type="date" name="fecha" value="{{ hoy }}" required class="form-control">
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label"><i class="bi bi-tag"></i> Categoría</label>
            <input type="text" name="categoria" placeholder="renta / luz / insumos..." required class="form-control">
          </div>

          <div class="col-12">
            <label class="form-label"><i class="bi bi-text-paragraph"></i> Descripción</label>
            <input type="text" name="descripcion" required class="form-control"
                   placeholder="Ej. Renta de noviembre, Pago de luz, etc.">
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label"><i class="bi bi-currency-dollar"></i> Importe</label>
            <input type="text" name="importe" inputmode="decimal" required class="form-control"
                   placeholder="250.00">
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label"><i class="bi bi-wallet2"></i> Método de pago</label>
            <select name="metodo_pago" required class="form-select">
              <option value="efectivo">Efectivo</option>
              <option value="tarjeta">Tarjeta</option>
              <option value="transferencia">Transferencia</option>
              <option value="otro">Otro</option>
            </select>
          </div>
        </div>

        <div class="d-flex gap-2 mt-4">
          <button class="btn btn-primary" type="submit">
            <i class="bi bi-check-circle"></i> Guardar
          </button>
          <a class="btn btn-secondary" href="{{ url_for('gastos.listado') }}">Cancelar</a>
        </div>

      </form>
    </div>
  </div>

{% endblock %}
